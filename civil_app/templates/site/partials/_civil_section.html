<!-- ================= CIVIL ================= -->

<div class="civil-section">

<!-- HEADER -->

<div class="section-header-modern">

<div class="section-left">
<div class="section-icon">👷</div>
<span>Civil Teams</span>
</div>

<div class="section-actions">

<select id="civilTeamSelect" class="team-select-modern">
<option value="">+ Add Team</option>

{% for t in teams %}

<option
value="{{ t.id }}"
data-mason="{{ t.teamrate_set.last.mason_full_rate }}"
data-helper="{{ t.teamrate_set.last.helper_full_rate }}"
>
{{ t.name }}
</option>
{% endfor %}

</select>

</div>

</div>

<!-- TABLE CARD -->

<div class="table-card-modern civil-wrapper">

<!-- HEADER -->

<div class="table-head-modern civil-grid1">

<div>Team</div>
<div class="text-center">M F</div>
<div class="text-center">H F</div>
<div class="text-center">M H</div>
<div class="text-center">H H</div>
<div class="text-center">Mason ₹</div>
<div class="text-center">Helper ₹</div>
<div class="text-center">Advance</div>
<div class="text-center">Type</div>
<div class="text-center">Allowance ₹</div>
<div class="text-center">Labour</div>
<div class="text-center">Total</div>

</div>

<!-- BODY -->

<div id="civilBody" class="table-body-modern">

{% for row in civil_rows %}

<div id="civil_row_{{ row.team.id }}" class="table-row-modern civil-grid">

<div class="font-semibold">
{{ row.team.name }}
</div>

<input name="mason_full_{{ row.team.id }}"
value="{{ row.work.mason_full|default:0 }}"
class="table-input-modern money"
oninput="calcCivil({{ row.team.id }}, {{ row.rate.mason_full_rate }}, {{ row.rate.helper_full_rate }})">

<input name="helper_full_{{ row.team.id }}"
value="{{ row.work.helper_full|default:0 }}"
class="table-input-modern money"
oninput="calcCivil({{ row.team.id }}, {{ row.rate.mason_full_rate }}, {{ row.rate.helper_full_rate }})">

<input name="mason_half_{{ row.team.id }}"
value="{{ row.work.mason_half|default:0 }}"
class="table-input-modern money"
oninput="calcCivil({{ row.team.id }}, {{ row.rate.mason_full_rate }}, {{ row.rate.helper_full_rate }})">

<input name="helper_half_{{ row.team.id }}"
value="{{ row.work.helper_half|default:0 }}"
class="table-input-modern money"
oninput="calcCivil({{ row.team.id }}, {{ row.rate.mason_full_rate }}, {{ row.rate.helper_full_rate }})">

<input
  name="mason_full_amount_{{ row.team.id }}"
  type="number"
  min="0"
  step="0.01"
  value="{{ row.work.mason_full_amount|default:row.rate.mason_full_rate }}"
  class="table-input-modern money"
  oninput="calcCivil({{ row.team.id }}, {{ row.rate.mason_full_rate }}, {{ row.rate.helper_full_rate }})"
>

<input
  name="helper_full_amount_{{ row.team.id }}"
  type="number"
  min="0"
  step="0.01"
  value="{{ row.work.helper_full_amount|default:row.rate.helper_full_rate }}"
  class="table-input-modern money"
  oninput="calcCivil({{ row.team.id }}, {{ row.rate.mason_full_rate }}, {{ row.rate.helper_full_rate }})"
>

<input name="advance_{{ row.team.id }}"
type="number"
min="0"
value="{{ row.advance|default:0 }}"
class="table-input-modern money advance-modern"
oninput="calcCivil({{ row.team.id }}, {{ row.rate.mason_full_rate }}, {{ row.rate.helper_full_rate }})">

<select name="allowance_type_{{ row.team.id }}" class="table-input-modern">

<option value="">-</option>

<option value="petrol"
{% if row.allowance_type == "petrol" %}selected{% endif %}>
Petrol
</option>

<option value="ot"
{% if row.allowance_type == "ot" %}selected{% endif %}>
OT
</option>

<option value="food"
{% if row.allowance_type == "food" %}selected{% endif %}>
Food
</option>

<option value="transport"
{% if row.allowance_type == "transport" %}selected{% endif %}>
Transport
</option>

</select>

<input name="extra_{{ row.team.id }}"
value="{{ row.extra }}"
min="0" type="number"
class="table-input-modern money"
oninput="calcCivil({{ row.team.id }}, {{ row.rate.mason_full_rate }}, {{ row.rate.helper_full_rate }})">

<div id="civil_labour_{{ row.team.id }}" class="table-box-modern labour-modern">
{{ row.labour }}
</div>

<div id="civil_total_{{ row.team.id }}" class="table-box-modern total-modern">
{{ row.total }}
</div>

</div>

{% endfor %}

</div>

</div>

</div>

<!-- ================= STYLES ================= -->

<style>

/* wrapper */
.civil-wrapper{
overflow-x:auto;
}

/* GRID (must match header + rows) */
.civil-grid{
display:grid;
grid-template-columns:
minmax(240px,1.4fr)
repeat(4,minmax(50px,.6fr))
minmax(70px,.7fr)
minmax(70px,.7fr)
minmax(80px,.8fr)
minmax(110px,1fr)
minmax(90px,.9fr)
minmax(90px,.9fr)
minmax(90px,.9fr)
minmax(90px,.9fr);
}

.civil-grid1{
display:grid;
grid-template-columns:
minmax(240px,1.4fr)
repeat(4,minmax(60px,.6fr))
minmax(80px,.7fr)
minmax(70px,.7fr)
minmax(90px,.8fr)
minmax(110px,1fr)
minmax(120px,.9fr)
minmax(90px,.9fr)
minmax(90px,.9fr)
minmax(90px,.9fr);
}

/* header alignment */
.table-head-modern > div{
display:flex;
align-items:center;
justify-content:center;
width:100%;
}

.table-head-modern > div:first-child{
justify-content:flex-start;
padding-left:12px;
}

/* inputs + select width */
.table-input-modern,
select.table-input-modern{
width:100%;
height:30px;
border:1px solid #d1d5db;
border-radius:6px;
padding:2px 6px;
font-size:.82rem;
font-weight:700;
background:white;
}

/* section header */
.section-header-modern{
display:flex;
align-items:center;
justify-content:space-between;
padding:14px 18px;
border-radius:14px;
border:1px solid #e2e8f0;
background:linear-gradient(180deg,#ffffff,#f8fafc);
font-weight:900;
margin-top:20px;
}

.section-left{
display:flex;
align-items:center;
gap:8px;
}

.section-icon{
width:32px;
height:32px;
border-radius:8px;
background:#f1f5f9;
display:flex;
align-items:center;
justify-content:center;
}

.section-actions{
display:flex;
gap:10px;
}

.team-select-modern{
border:1px solid #e2e8f0;
border-radius:10px;
padding:6px 10px;
font-weight:700;
background:white;
}

/* card */
.table-card-modern{
margin-top:8px;
background:white;
border-radius:16px;
border:1px solid #e5e7eb;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,.05);
}

/* header row */
.table-head-modern{
background:linear-gradient(180deg,#f8fafc,#eef2ff);
padding:10px 14px;
font-size:.72rem;
font-weight:900;
color:#475569;
border-bottom:1px solid #e5e7eb;
}

/* table body */
.table-body-modern{
max-height:420px;
overflow-y:auto;
}

/* rows */
.table-row-modern{
align-items:center;
gap:8px;
padding:10px 14px;
border-bottom:1px solid #f1f5f9;
background:white;
}

.table-row-modern:hover{
background:#f8fafc;
}

/* team name column */
.table-row-modern > div:first-child{
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
font-weight:700;
}

/* value boxes */
.table-box-modern{
height:30px;
display:flex;
align-items:center;
justify-content:center;
background:#f1f5f9;
border-radius:6px;
font-weight:800;
font-size:.82rem;
}

.money{
text-align:right;
}

/* colors */
.labour-modern{
background:#fef3c7;
color:#92400e;
}

.total-modern{
background:#dcfce7;
color:#166534;
}

.advance-modern{
background:#fff7ed;
}

</style>


<!-- ================= SCRIPT ================= -->

<script>

document.getElementById("civilTeamSelect")
.addEventListener("change", addCivilTeam);

function addCivilTeam(){

const select = document.getElementById("civilTeamSelect");
const option = select.options[select.selectedIndex];

const teamId = option.value;
const teamName = option.text;

const masonRate = option.dataset.mason;
const helperRate = option.dataset.helper;

if(!teamId){
alert("Select team first");
return;
}

if(document.getElementById("civil_row_"+teamId)){
alert("Team already added");
return;
}

const container = document.getElementById("civilBody");

const html = `

<div id="civil_row_${teamId}" class="table-row-modern civil-grid">

<div class="font-semibold">${teamName}</div>

<input name="mason_full_${teamId}" class="table-input-modern money"
oninput="calcCivil(${teamId},${masonRate},${helperRate})">

<input name="helper_full_${teamId}" class="table-input-modern money"
oninput="calcCivil(${teamId},${masonRate},${helperRate})">

<input name="mason_half_${teamId}" class="table-input-modern money"
oninput="calcCivil(${teamId},${masonRate},${helperRate})">

<input name="helper_half_${teamId}" class="table-input-modern money"
oninput="calcCivil(${teamId},${masonRate},${helperRate})">

<input
  name="mason_full_amount_${teamId}"
  type="number"
  min="0"
  step="0.01"
  value="${masonRate}"
  class="table-input-modern money"
  oninput="calcCivil(${teamId},${masonRate},${helperRate})"
>

<input
  name="helper_full_amount_${teamId}"
  type="number"
  min="0"
  step="0.01"
  value="${helperRate}"
  class="table-input-modern money"
  oninput="calcCivil(${teamId},${masonRate},${helperRate})"
>

<input name="advance_{{ row.team.id }}"
min="0"
type="number"
value="{{ row.advance|default:0 }}"
class="table-input-modern money advance-modern">

<select name="allowance_type_${teamId}" class="table-input-modern">
<option value="">-</option>
<option value="petrol">Petrol</option>
<option value="ot">OT</option>
<option value="food">Food</option>
<option value="transport">Transport</option>
</select>

<input name="extra_${teamId}" class="table-input-modern money"
oninput="calcCivil(${teamId},${masonRate},${helperRate})">

<div id="civil_labour_${teamId}" class="table-box-modern labour-modern">0</div>
<div id="civil_total_${teamId}" class="table-box-modern total-modern">0</div>

</div>

`;

container.insertAdjacentHTML("beforeend", html);

}

function calcCivil(id, masonRate, helperRate) {

    const mf =
        +document.querySelector(`[name="mason_full_${id}"]`)?.value || 0;

    const mh =
        +document.querySelector(`[name="mason_half_${id}"]`)?.value || 0;

    const hf =
        +document.querySelector(`[name="helper_full_${id}"]`)?.value || 0;

    const hh =
        +document.querySelector(`[name="helper_half_${id}"]`)?.value || 0;

    const masonAmount =
        +document.querySelector(`[name="mason_full_amount_${id}"]`)?.value || 0;

    const helperAmount =
        +document.querySelector(`[name="helper_full_amount_${id}"]`)?.value || 0;

    const advance =
        +document.querySelector(`[name="advance_${id}"]`)?.value || 0;

    const extra =
        +document.querySelector(`[name="extra_${id}"]`)?.value || 0;

    const labour =
        (mf * masonAmount) +
        (mh * masonAmount / 2) +
        (hf * helperAmount) +
        (hh * helperAmount / 2);

    const total = Math.max(labour + extra - advance, 0);

    document.getElementById(`civil_labour_${id}`).innerText =
        labour.toLocaleString("en-IN");

    document.getElementById(`civil_total_${id}`).innerText =
        total.toLocaleString("en-IN");

    updateLiveGrandTotal();
}
</script>
