{% load civil_extras %}

<!-- ================= OTHER EXPENSES ================= -->
<h3 onclick="toggleSection(this)" class="section-title-modern">
  <span class="flex items-center gap-2">
    💸 <span>Other Expenses</span>
  </span>
  <span class="section-arrow-modern">▾</span>
</h3>

<div class="table-card-modern expense-wrapper">

  <!-- ===== HEADER ===== -->
  <div class="table-head-modern"
       style="grid-template-columns:
       minmax(180px,1.5fr)
       minmax(180px,1.5fr)
       minmax(110px,.9fr)
       minmax(200px,1.6fr)
       minmax(70px,.5fr);">

    <div>Expense</div>
    <div>Received From</div>
    <div class="text-center">Amount</div>
    <div>Notes</div>
    <div class="text-center">Action</div>
  </div>

  <!-- ===== BODY ===== -->
  <div id="expenseRows" class="table-body-modern">

    {% for e in other_expenses %}
    <div class="table-row-modern expense-row"
         style="grid-template-columns:
         minmax(180px,1.5fr)
         minmax(180px,1.5fr)
         minmax(110px,.9fr)
         minmax(200px,1.6fr)
         minmax(70px,.5fr);">

      <!-- Title -->
      <input name="expense_title_{{ forloop.counter0 }}"
             value="{{ e.title }}"
             class="table-input-modern">

      <!-- Owner -->
      <div>
        <select name="expense_owner_{{ forloop.counter0 }}"
        class="table-input-modern owner-select"
        onchange="handleOwnerChange(this)">

  <option value="">-- Choose Owner --</option>

  {% for o in owners %}
    <option value="{{ o.id }}"
            data-balance="{{ o.balance|default:0 }}"
            {% if e.owner and e.owner.id == o.id %}selected{% endif %}>
      {{ o.name }}
    </option>
  {% endfor %}

</select>

        <div class="text-xs text-gray-500 balance-preview"></div>
      </div>

      <!-- Amount -->
      <input name="expense_amount_{{ forloop.counter0 }}"
             value="{{ e.amount }}"
             class="table-input-modern money amount-field"
             oninput="validateExpenseBalance(this); updateLiveGrandTotal?.()">

      <!-- Notes -->
      <input name="expense_notes_{{ forloop.counter0 }}"
             value="{{ e.notes }}"
             class="table-input-modern">

      <!-- Delete -->
      <div class="flex justify-center">
        <button type="button"
          onclick="this.closest('.expense-row').remove(); updateLiveGrandTotal?.();"
          class="delete-btn-modern">
          ✕
        </button>
      </div>

    </div>
    {% endfor %}

  </div>

  <!-- ===== FOOTER ===== -->
  <div class="table-footer-modern">
    <span>💡 Expense will reduce owner balance (can go negative)</span>
    <button type="button" onclick="addExpenseRow()" class="btn-green-modern">
      ➕ Add Expense
    </button>
  </div>

</div>

<!-- ================= STYLE ================= -->
<style>
.expense-row:hover{
  background:linear-gradient(to right,#faf5ff,#ffffff);
  transform:scale(1.002);
  transition:.15s ease;
}

.owner-select{
  background:linear-gradient(180deg,#ffffff,#faf5ff);
}

.amount-field{
  background:linear-gradient(180deg,#ffffff,#f3e8ff);
  color:#6b21a8;
  font-weight:800;
}

@media (max-width:768px){
  .expense-row{
    min-width:860px;
  }
}
</style>

<!-- ================= SCRIPT ================= -->
<script>

let expenseIndex = {{ other_expenses|length|default:0 }};

/* ===== ADD ROW ===== */
function addExpenseRow(){
  const container = document.getElementById("expenseRows");

  const row = document.createElement("div");
  row.className = "table-row-modern expense-row";

  row.style.gridTemplateColumns = `
    minmax(180px,1.5fr)
    minmax(180px,1.5fr)
    minmax(110px,.9fr)
    minmax(200px,1.6fr)
    minmax(70px,.5fr)
  `;

  row.innerHTML = `
    <input name="expense_title_${expenseIndex}"
           class="table-input-modern">

    <div>
      <select name="expense_owner_${expenseIndex}"
              class="table-input-modern owner-select"
              onchange="handleOwnerChange(this)">
        <option value="" disabled selected hidden>Choose Owner</option>

        {% for oc in owner_cash_entries %}
          <option value="{{ oc.id }}"
                  data-balance="{{ oc.balance|default:oc.amount }}">
            {{ oc.owner.name }}
          </option>
        {% endfor %}
      </select>

      <div class="text-xs text-gray-500 balance-preview"></div>
    </div>

    <input name="expense_amount_${expenseIndex}"
           value="0"
           class="table-input-modern money amount-field"
           oninput="validateExpenseBalance(this)">

    <input name="expense_notes_${expenseIndex}"
           class="table-input-modern">

    <div class="flex justify-center">
      <button type="button"
        onclick="this.closest('.expense-row').remove()"
        class="delete-btn-modern">
        ✕
      </button>
    </div>
  `;

  container.appendChild(row);
  expenseIndex++;
}

/* ===== OWNER CHANGE ===== */
function handleOwnerChange(select){

  const row = select.closest(".expense-row");
  const preview = row.querySelector(".balance-preview");

  const option = select.selectedOptions[0];
  const balance = Number(option.dataset.balance || 0);

  preview.textContent = `Available: ₹${balance.toLocaleString("en-IN")}`;

  const amountInput = row.querySelector('[name^="expense_amount_"]');
  validateExpenseBalance(amountInput);
}

/* ===== VALIDATION (NEGATIVE ALLOWED) ===== */
function validateExpenseBalance(amountInput){

  const row = amountInput.closest(".expense-row");
  const ownerSelect = row.querySelector('[name^="expense_owner_"]');

  if (!ownerSelect.value) return;

  const option = ownerSelect.selectedOptions[0];
  const balance = Number(option.dataset.balance || 0);
  const amount = Number(amountInput.value || 0);

  const remaining = balance - amount;

  amountInput.classList.remove("ring-2","ring-red-400","ring-green-400");

  if (remaining < 0){
    amountInput.classList.add("ring-2","ring-red-400");
  } else {
    amountInput.classList.add("ring-2","ring-green-400");
  }

  amountInput.title = `After: ₹${remaining.toLocaleString("en-IN")}`;
}

/* ===== TOGGLE ===== */
function toggleSection(el){
  const card = el.nextElementSibling;
  if (!card) return;
  card.classList.toggle("hidden");
}

</script>
